name: ManyAgentsPhone
options:
  bundleIdPrefix: co.ailogy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Automatic signing: the team comes from whatever Apple ID Xcode is
    # signed in with, same as the StuBuddy project next door.
    CODE_SIGN_STYLE: Automatic

schemes:
  ManyAgentsPhone:
    build:
      targets:
        ManyAgentsPhone: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  ManyAgentsPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ManyAgentsPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.ailogy.manyagents.phone
        PRODUCT_NAME: ManyAgents
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: ManyAgents
        # Pairing is a QR scan, which needs the camera and nothing else.
        INFOPLIST_KEY_NSCameraUsageDescription: "Scanning the pairing code shown in ManyAgents on your Mac."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1,2"
