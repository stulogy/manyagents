name: ManyAgentsPhone
options:
  bundleIdPrefix: co.ailogy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Automatic signing: the team comes from whatever Apple ID Xcode is
    # signed in with, same as the StuBuddy project next door.
    CODE_SIGN_STYLE: Automatic

schemes:
  ManyAgentsPhone:
    build:
      targets:
        ManyAgentsPhone: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  ManyAgentsPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ManyAgentsPhone
      # Shared with the Mac app rather than copied. Both render the same
      # tool calls, and a second copy of these names would drift the first
      # time a tool is added — which is exactly what happened when the Mac
      # learned to say "Read preview" and the phone kept showing
      # mcp__manyagents__preview_look. Pure Foundation, no AppKit.
      - path: ../Sources/ManyAgents/Models/ToolNaming.swift
        group: Shared
    info:
      path: ManyAgentsPhone/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: co.ailogy.manyagents.phone
            CFBundleURLSchemes: [manyagents]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Scanning the pairing code shown in ManyAgents on your Mac."
        NSMicrophoneUsageDescription: "Talking to your agents hands-free."
        NSSpeechRecognitionUsageDescription: "Turning what you say into a message for your agents. Recognition runs on this iPhone."
        UIBackgroundModes: [audio]
        CFBundleDisplayName: ManyAgents
        # Read from the build settings so a build can be identified on the
        # device. Hardcoded as 1, every install looked identical and there
        # was no way to answer "is the latest actually on my phone?".
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.ailogy.manyagents.phone
        PRODUCT_NAME: ManyAgents
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
